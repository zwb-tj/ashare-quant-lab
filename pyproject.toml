[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant-lab"
version = "0.9.0"
description = "An original, reproducible A-share screening & backtesting lab with an auditable tool-using LLM research agent and evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Weibin Zhang" }]
keywords = ["quant", "backtest", "a-share", "screening", "llm", "agent"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
data = ["tushare>=1.2", "akshare>=1.10"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[project.scripts]
aqlab = "aqlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
