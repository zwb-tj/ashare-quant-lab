[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant-lab"
version = "0.28.0"
description = "An original, reproducible A-share screening & backtesting lab with an auditable tool-using LLM research agent and evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Weibin Zhang" }]
keywords = ["quant", "backtest", "a-share", "screening", "llm", "agent"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
data = ["tushare>=1.2", "akshare>=1.10"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "matplotlib>=3.7", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
aqlab = "aqlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---- lint / type policy (pinned in-repo so CI and local runs agree) ----
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "output", "build", "dist"]

[tool.ruff.lint]
# Correctness first: pycodestyle errors, pyflakes, import order, bugbear, simplifications,
# comprehensions and ruff-specific smells. Deliberately not "ALL" — a rule set the project
# actually keeps green is worth more than a long list that gets suppressed.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "C4", "SIM", "RUF"]
# RUF001-003 flag ambiguous/full-width punctuation, which is intentional in Chinese docstrings.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately compare NaN with itself (x != x) and assert on private helpers.
"tests/*" = ["E402"]

[tool.mypy]
# No pinned python_version on purpose: mypy parses third-party stubs too, and recent
# numpy stubs use PEP 695 syntax that only parses as 3.12+, which breaks the whole run.
# mypy therefore follows the interpreter it runs on (3.12 in CI), while 3.10 syntax
# compatibility is enforced by ruff's target-version and by running the suite on
# 3.10 / 3.11 / 3.12 in CI.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# The numeric core is pandas/numpy-heavy; strict mode would mostly fight the stubs.
check_untyped_defs = false
disallow_untyped_defs = false
exclude = ["^data/", "^output/", "^build/", "^dist/"]
