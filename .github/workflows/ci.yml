name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Static analysis runs once, on the newest interpreter: lint rules and the
      # third-party type stubs are interpreter dependent, so pinning the check to one
      # Python keeps it deterministic. The older interpreters exist to prove the
      # runtime still works there.
      - name: Lint (ruff, report only)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: ruff check src tests

      - name: Type check (mypy, report only)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: mypy src/aqlab

      - name: Run tests
        run: pytest -q

      - name: Coverage (report only)
        if: matrix.python-version == '3.12'
        run: pytest -q --cov=aqlab --cov-report=term

      - name: Smoke test the CLI (offline demo)
        run: |
          python -m aqlab.cli demo --seed 25 --out /tmp/aqlab_out
          python -m aqlab.cli screen --symbols 20 --days 400 --top 5 --out /tmp/aqlab_out
