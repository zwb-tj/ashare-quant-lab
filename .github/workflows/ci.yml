name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke test the CLI (offline demo)
        run: |
          python -m aqlab.cli demo --seed 25 --out /tmp/aqlab_out
          python -m aqlab.cli screen --symbols 20 --days 400 --top 5 --out /tmp/aqlab_out
